services:
  postgres:
    image: postgres:16-alpine
    container_name: oneapplyhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oneapplyhub_dev
      POSTGRES_USER: oneapplyhub
      POSTGRES_PASSWORD: CHANGE_ME
    ports:
      - "5432:5432"
    volumes:
      - oneapplyhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneapplyhub -d oneapplyhub_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: oneapplyhub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@oneapplyhub.local
      PGADMIN_DEFAULT_PASSWORD: CHANGE_ME
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - oneapplyhub_pgadmin:/var/lib/pgadmin

volumes:
  oneapplyhub_pgdata:
  oneapplyhub_pgadmin:
